# Path trimming keeps local build paths out of release artefacts and diagnostics.
cargo-features = ["trim-paths"]

[package]
name = "Breadbin466"
version = "0.99.0"
edition = "2024"
license = "MIT"

# The shared dependency set covers audio, input, windowing, rendering, image I/O,
# native file dialogs and serialisation used by every supported desktop platform.
[dependencies]
cpal = "0.18.2"
gilrs = "0.11.2"
winit = "0.30.13"
wgpu = "30.0.1"
bytemuck = "1.25.2"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lzma-rust2 = { version = "0.20.1", default-features = false, features = ["std", "encoder"] }
sha2 = "0.11.0"

# Native menu and application integration are selected per target so that platform
# concerns remain outside the emulation core.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSDictionary", "NSAttributedString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSGraphics", "NSText", "NSAlert", "NSApplication", "NSButton", "NSButtonCell", "NSMenu", "NSMenuItem", "NSEvent", "NSCell", "NSControl", "NSOpenPanel", "NSPopUpButton", "NSResponder", "NSSavePanel", "NSTextField", "NSView", "NSWindow", "NSAttributedString", "NSTabView", "NSTabViewItem", "NSTextView", "NSTextContainer", "NSTextStorage", "NSScrollView", "NSClipView", "NSFont", "NSColor", "NSParagraphStyle"] }

[target.'cfg(target_os = "windows")'.dependencies]
wfd = "0.1.8"
windows = { version = "=0.62.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_HiDpi",
	"Win32_UI_Controls",
	"Win32_UI_Controls_RichEdit",
	"Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_HiDpi",
	"Win32_UI_Controls",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19.0"

# Release builds favour deterministic whole-program optimisation and a small final
# executable over incremental compilation speed or recoverable unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
trim-paths = "all"

# Bundle metadata is consumed by cargo-bundle when producing the native macOS
# application package; it does not affect emulator behaviour.
[package.metadata.bundle]
name = "Breadbin466"
identifier = "com.foursixsix.breadbin466"
version = "0.99.0"
copyright = "Copyright © 2025–2026 The Breadbin466 Team"
category = "public.app-category.entertainment"
short_description = "C64 Emulator"
long_description = "Commodore 64 emulator written in Rust."
icon = ["assets/Breadbin466.icns"]
